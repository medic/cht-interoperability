createNamespace: true  # For template/01-namespace.yaml
cluster_type: "k3d"   # Default to k3d for local development

# Default values for health-interop
global:
  namespace: cht-interop

# Database configurations
couchdb:
  enabled: true  # Set to false to use external CHT/CouchDB
  image: public.ecr.aws/medic/cht-couchdb:4.1.0-alpha
  storage: 10Gi
  credentials:
    username: admin
    password: password
    secret: secret
    uuid: CC0C3BA1-88EE-4AE3-BFD3-6E0EE56ED534
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
      ephemeral-storage: "500Mi"
    limits:
      memory: "2Gi"
      cpu: "1000m"
      ephemeral-storage: "2Gi"

mongodb:
  image: mongo:4.2
  storage: 5Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
      ephemeral-storage: "256Mi"
    limits:
      memory: "1Gi"
      cpu: "500m"
      ephemeral-storage: "1Gi"

postgresql:
  image: postgres:14.1
  storage: 5Gi
  credentials:
    username: admin
    password: instant101
    database: hapi
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
      ephemeral-storage: "256Mi"
    limits:
      memory: "1Gi"
      cpu: "500m"
      ephemeral-storage: "1Gi"

# OpenHIM configuration
openhim:
  core:
    image: jembi/openhim-core:7
    replicas: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
        ephemeral-storage: "100Mi"
      limits:
        memory: "512Mi"
        cpu: "500m"
        ephemeral-storage: "500Mi"
  console:
    image: jembi/openhim-console:1.14.4
    replicas: 1
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
        ephemeral-storage: "50Mi"
      limits:
        memory: "128Mi"
        cpu: "200m"
        ephemeral-storage: "200Mi"
    config:
      protocol: https
      host: localhost
      port: 8080

# CHT configuration
cht:
  enabled: true  # Set to false to use external CHT instance
  # External CHT configuration (used when cht.enabled=false)
  external:
    url: ""  # e.g., https://external-cht.example.com
    username: ""
    password: ""
  api:
    image: public.ecr.aws/medic/cht-api:4.1.0-alpha
    replicas: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
        ephemeral-storage: "100Mi"
      limits:
        memory: "512Mi"
        cpu: "500m"
        ephemeral-storage: "500Mi"
  nginx:
    image: public.ecr.aws/medic/cht-nginx:4.1.0-alpha
    replicas: 1
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
        ephemeral-storage: "50Mi"
      limits:
        memory: "256Mi"
        cpu: "200m"
        ephemeral-storage: "200Mi"
  haproxy:
    image: public.ecr.aws/medic/cht-haproxy:4.1.0-alpha
    replicas: 1
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
        ephemeral-storage: "50Mi"
      limits:
        memory: "256Mi"
        cpu: "200m"
        ephemeral-storage: "200Mi"
  sentinel:
    image: public.ecr.aws/medic/cht-sentinel:4.1.0-alpha
    replicas: 1
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
        ephemeral-storage: "100Mi"
      limits:
        memory: "256Mi"
        cpu: "300m"
        ephemeral-storage: "300Mi"
  healthcheck:
    image: public.ecr.aws/medic/cht-haproxy-healthcheck:4.1.0-alpha
    replicas: 1
    resources:
      requests:
        memory: "32Mi"
        cpu: "25m"
        ephemeral-storage: "50Mi"
      limits:
        memory: "64Mi"
        cpu: "100m"
        ephemeral-storage: "100Mi"

# HAPI FHIR configuration
hapiFhir:
  image: hapiproject/hapi:v5.5.1
  replicas: 1
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
      ephemeral-storage: "500Mi"
    limits:
      memory: "3Gi"
      cpu: "1000m"
      ephemeral-storage: "2Gi"

# Mediator configuration
mediator:
  image: mediator:local
  imagePullPolicy: Never
  replicas: 1
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
      ephemeral-storage: "100Mi"
    limits:
      memory: "256Mi"
      cpu: "300m"
      ephemeral-storage: "300Mi"
  credentials:
    openhimUsername: interop@openhim.org
    openhimPassword: interop-password
    fhirUsername: interop-client
    fhirPassword: interop-password
    chtUsername: admin
    chtPassword: password

# Configurator configuration
configurator:
  image: configurator:local
  imagePullPolicy: Never
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
      ephemeral-storage: "100Mi"
    limits:
      memory: "256Mi"
      cpu: "300m"
      ephemeral-storage: "300Mi"

# Storage configuration
persistence:
  storageClass: local-path  # k3d default storage class
  chtCredentials: 1Gi
  chtSsl: 1Gi

# Service configuration
services:
  nodePort:
    nginx: 30080
    nginxHttps: 30443
    console: 30900
    mediator: 30600
    openhimCore: 30081
    openhimRouterHttp: 30500
    openhimRouterHttps: 30501

